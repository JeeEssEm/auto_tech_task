networks:
  app_network:
    driver: bridge

services:
  db:
      image: postgres:17-alpine
      restart: unless-stopped
      env_file: .env
      environment:
          POSTGRES_USER: ${POSTGRES_USER}
          POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
          POSTGRES_DB: ${POSTGRES_DB}
      volumes:
        - postgres-data:/var/lib/postgresql/data/
      networks:
        - app_network
      ports:
        - "5432:5432"

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    env_file: .env
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - app_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    networks:
      - app_network

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    ports:
      - "9333:9333"
      - "8080:8080"
      - "8888:8888"
      - "8333:8333"
    command: 'server -s3 -s3.config=/etc/seaweedfs/s3_config.json -dir=/data'
    volumes:
      - ./data:/data
      - ./s3_config.json:/etc/seaweedfs/s3_config.json
    restart: unless-stopped
    networks:
      - app_network

volumes:
  postgres-data:
  redis-data:
  rabbitmq:
